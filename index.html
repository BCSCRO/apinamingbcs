<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramienta Naming Ventas Digitales - Banco Caja Social</title>
    <style>
        :root {
            --banco-blue: #003366;
            --banco-hover: #002244;
            --banco-green: #4cbd74;
            --bg-gray: #f4f7fa;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #1a202c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background-color: var(--bg-gray); 
            color: var(--text-color);
            margin: 0;
        }
        .container { 
            max-width: 1100px; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            margin: 10px auto; 
        }
        
        .header-app { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding-bottom: 18px; 
            margin-bottom: 20px; 
            border-bottom: 4px solid var(--banco-blue); 
        }
        .logo-text { 
            font-size: 24px; 
            font-weight: bold; 
            color: var(--banco-blue); 
        }
        .title-app { 
            color: var(--banco-blue); 
            font-size: 18px; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin: 0; 
            text-align: right; 
        }

        .tabs { 
            display: flex; 
            border-bottom: 2px solid var(--border-color); 
            margin-bottom: 20px; 
            gap: 4px;
        }
        .tab-button { 
            padding: 10px 18px; 
            cursor: pointer; 
            background: #e2e8f0; 
            border: none; 
            border-radius: 6px 6px 0 0; 
            font-weight: bold; 
            color: #4a5568; 
            font-size: 13px;
        }
        .tab-button.active { 
            background: var(--banco-blue); 
            color: white; 
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); 
            gap: 14px; 
        }
        .full-width { grid-column: 1 / -1; }
        label { 
            font-weight: 700; 
            display: block; 
            margin-top: 4px; 
            color: #4a5568; 
            font-size: 12px; 
            text-transform: uppercase;
        }
        select, input { 
            width: 100%; 
            padding: 8px 10px; 
            margin-top: 4px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 13px; 
            background-color: #fff;
        }
        select:focus, input:focus { 
            border-color: var(--banco-blue); 
            outline: none; 
            background-color: #f8fafc; 
        }
        .custom-input {
            margin-top: 4px;
            border-color: var(--banco-green);
            background-color: #f0fdf4;
            display: none;
        }

        .batch-box {
            background: #f0fdf4;
            border: 1px solid var(--banco-green);
            border-radius: 8px;
            padding: 16px;
            margin-top: 15px;
        }
        .batch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .batch-item {
            background: white;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .batch-item label {
            margin: 0;
            text-transform: capitalize;
            font-size: 12px;
        }
        .batch-item input[type="number"] {
            width: 55px;
            padding: 4px;
            margin: 0;
            text-align: center;
        }

        button.primary-btn { 
            width: 100%; 
            background-color: var(--banco-blue); 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            margin-top: 15px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
        }
        button.primary-btn:hover { background-color: var(--banco-hover); }
        button.primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .result-box { 
            margin-top: 20px; 
            padding: 18px; 
            background: #f8fafc; 
            border: 1px solid var(--border-color);
            border-left: 6px solid var(--banco-blue); 
            border-radius: 8px; 
            display: none;
        }

        .batch-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            margin-top: 12px;
            background: white;
        }
        .batch-table th, .batch-table td {
            padding: 8px;
            border: 1px solid #cbd5e1;
            text-align: left;
        }
        .batch-table th {
            background: var(--banco-blue);
            color: white;
        }

        .copy-btn { 
            background-color: #edf2f7; 
            color: #4a5568; 
            padding: 6px 12px; 
            font-size: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 600; 
        }
        .copy-btn:hover { background-color: #e2e8f0; }

        .history-table-container { margin-top: 15px; overflow-x: auto; }
        table.history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            text-align: left;
        }
        table.history-table th, table.history-table td {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        table.history-table th {
            background-color: var(--banco-blue);
            color: white;
        }

        .status-alert {
            margin-top: 10px;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
        }
        .status-alert.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }
        .status-alert.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        code {
            background: #f1f5f9;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-app">
        <div class="logo-text">🏦 BANCO CAJA SOCIAL</div>
        <div class="title-app">Herramienta Naming Ventas Digitales</div>
    </div>

    <div class="tabs">
        <button class="tab-button active" onclick="cambiarTab(event, 'tab-generador')">📝 Generador</button>
        <button class="tab-button" onclick="cambiarTab(event, 'tab-config')">📊 Historial</button>
    </div>

    <!-- TAB 1: GENERADOR -->
    <div id="tab-generador" class="tab-content active">
        <div class="grid">
            <!-- Journey Number -->
            <div>
                <label>Journey Number</label>
                <input type="text" id="journey_num" placeholder="j1" value="j1">
            </div>

            <!-- Línea Presupuestal -->
            <div>
                <label>Línea Presupuestal *</label>
                <select id="linea_presupuestal" onchange="gestionarOpCultura('linea_presupuestal')">
                    <option value="">--Selecciona--</option>
                    <option value="bau">BAU - Adquisición</option>
                    <option value="con">CON - Conversión</option>
                    <option value="rea">REA - Reactivación</option>
                    <option value="prd">PRD - Profundización</option>
                    <option value="fid">FID - Fidelización</option>
                    <option value="onb">ONB - Onboarding</option>
                    <option value="cmi">CMI - CMI</option>
                    <option value="otr">OTR - Otras campañas</option>
                    <option value="CUSTOM">➕ Custom</option>
                </select>
                <input type="text" id="linea_presupuestal_custom" class="custom-input" placeholder="Escribe valor custom">
            </div>

            <!-- Producto (ANTES que Campaña) -->
            <div>
                <label>Producto *</label>
                <select id="producto" onchange="gestionarOpCultura('producto'); actualizarOpcionesTipoBase()">
                    <option value="">--Selecciona--</option>
                    <option value="cad">CAD - Cuentamiga</option>
                    <option value="tdc">TDC - Tarjeta Débito Clásica</option>
                    <option value="crd">CRD - Crédito</option>
                    <option value="lib">LIB - Libranzas</option>
                    <option value="viv">VIV - Vivienda</option>
                    <option value="rem">REM - Remesas</option>
                    <option value="nga">NGA - No Gestionable</option>
                    <option value="fic">FIC - FIC</option>
                    <option value="cdt">CDT - CDT</option>
                    <option value="prd">PRD - Preaprobado</option>
                    <option value="CUSTOM">➕ Custom</option>
                </select>
                <input type="text" id="producto_custom" class="custom-input" placeholder="Escribe valor custom">
            </div>

            <!-- Campaña (DESPUÉS de Producto) -->
            <div>
                <label>Campaña *</label>
                <select id="campana" onchange="gestionarOpCultura('campana')">
                    <option value="">--Selecciona--</option>
                    <option value="tyg">TYG - Transa y gana</option>
                    <option value="pam">PAM - Promo Aniversario</option>
                    <option value="mcd">MCD - Mes del Cliente</option>
                    <option value="nbe">NBE - New Business</option>
                    <option value="esn">ESN - Estacionales</option>
                    <option value="ma">MA - Multipago</option>
                    <option value="col">COL - Colombia</option>
                    <option value="sigo">SIGO - Siglo</option>
                    <option value="CUSTOM">➕ Custom</option>
                </select>
                <input type="text" id="campana_custom" class="custom-input" placeholder="Escribe valor custom">
            </div>

            <!-- Tipo de Base (dinámico según producto) -->
            <div>
                <label>Tipo de Base</label>
                <select id="tipo_base" onchange="gestionarOpCultura('tipo_base')">
                    <option value="">--Sin tipo--</option>
                </select>
                <input type="text" id="tipo_base_custom" class="custom-input" placeholder="Escribe valor custom">
            </div>

            <!-- Segmento (con opción en blanco) -->
            <div>
                <label>Segmento</label>
                <select id="segmento" onchange="gestionarOpCultura('segmento')">
                    <option value="">--En blanco--</option>
                    <option value="per">PER - Personal</option>
                    <option value="mic">MIC - Microempresa</option>
                    <option value="emp">EMP - Empresa</option>
                    <option value="pym">PYM - PyME</option>
                    <option value="pen">PEN - Pensionista</option>
                    <option value="CUSTOM">➕ Custom</option>
                </select>
                <input type="text" id="segmento_custom" class="custom-input" placeholder="Escribe valor custom">
            </div>

            <!-- Oferta (con opción en blanco) -->
            <div>
                <label>Oferta</label>
                <select id="oferta" onchange="gestionarOpCultura('oferta')">
                    <option value="">--En blanco--</option>
                    <option value="breb">BREB - Bienvenida</option>
                    <option value="usal">USAL - Usuario Antiguo</option>
                    <option value="us">US - Aumento Límite</option>
                    <option value="gan">GAN - Ganar > Perder</option>
                    <option value="ref">REF - Referidos</option>
                    <option value="mejviv">MEJVIV - Mejora Vivienda</option>
                    <option value="seg">SEG - Seguro</option>
                    <option value="beni">BENI - Beneficio</option>
                    <option value="apal">APAL - Apertura Plazo</option>
                    <option value="apfics">APFICS - Apertura Plazo FIC</option>
                    <option value="simp">SIMP - Simplifica</option>
                    <option value="CUSTOM">➕ Custom</option>
                </select>
                <input type="text" id="oferta_custom" class="custom-input" placeholder="Escribe valor custom">
            </div>

            <!-- Canal (con opción en blanco) -->
            <div>
                <label>Canal</label>
                <select id="canal" onchange="gestionarOpCultura('canal')">
                    <option value="">--En blanco--</option>
                    <option value="md">MD - Medios Directos</option>
                    <option value="ads">ADS - Google Ads</option>
                    <option value="mp">MP - Meta Ads</option>
                    <option value="CUSTOM">➕ Custom</option>
                </select>
                <input type="text" id="canal_custom" class="custom-input" placeholder="Escribe valor custom">
            </div>

            <!-- Fecha -->
            <div>
                <label>Fecha (ej: 092026)</label>
                <input type="text" id="fecha" placeholder="092026" value="092026">
            </div>

            <!-- URL Base -->
            <div class="full-width">
                <label>URL Base (opcional)</label>
                <input type="text" id="url_base" placeholder="https://ejemplo.com/landing">
            </div>
        </div>

        <!-- SELECTOR MULTICANAL -->
        <div class="batch-box">
            <strong>📧 Cantidad de Impactos por Medio</strong>
            <div class="batch-grid">
                <div class="batch-item">
                    <label>📧 Email</label>
                    <input type="number" id="cant_email" min="0" max="10" value="0">
                </div>
                <div class="batch-item">
                    <label>📱 WhatsApp</label>
                    <input type="number" id="cant_whatsapp" min="0" max="10" value="0">
                </div>
                <div class="batch-item">
                    <label>💬 SMS</label>
                    <input type="number" id="cant_sms" min="0" max="10" value="0">
                </div>
            </div>
        </div>

        <!-- BOTONES DE ACCIÓN -->
        <button class="primary-btn" onclick="generarLote()">🚀 Generar Lote</button>

        <!-- RESULTADO DEL LOTE -->
        <div id="result-box-lote" class="result-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <strong style="font-size: 16px;">📋 Lote Generado</strong>
                <button class="copy-btn" onclick="copiarTablaMasiva()">📋 Copiar Tabla</button>
            </div>
            <table class="batch-table">
                <thead>
                    <tr>
                        <th>Medio</th>
                        <th>Impacto</th>
                        <th>Journey Name</th>
                        <th>Message Name</th>
                        <th>UTM Campaign</th>
                        <th>UTM Content</th>
                        <th>URL Final</th>
                    </tr>
                </thead>
                <tbody id="filas-lote"></tbody>
            </table>

            <div id="status-mensaje"></div>
            <button class="primary-btn" id="btn-guardar-lote" onclick="guardarLoteEnBitacora()">💾 Registrar Lote en Google Sheets</button>
        </div>
    </div>

    <!-- TAB 2: HISTORIAL -->
    <div id="tab-config" class="tab-content">
        <h3 style="color: var(--banco-blue); margin-top: 0;">📊 Historial de Registros en Google Sheets</h3>
        <div class="history-table-container">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Medio</th>
                        <th>Journey Name</th>
                        <th>Message Name</th>
                        <th>UTM Campaign</th>
                    </tr>
                </thead>
                <tbody id="historial-filas">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #a0aec0; padding: 20px;">
                            Cargando registros...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ⭐ URL de Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNV7zeleJ133uN6PMoHkBDLDNzRMactXOZK7fcTwcxi8cEpw0UOBzhCCu0ijnKku_hXw/exec";

    let loteActualCalculado = [];

    // MAPEO DE TIPOS DE BASE POR PRODUCTO
    const tiposBaseMap = {
        'cad': ['VF'],
        'tdc': ['PA'],
        'crd': ['VF', 'PA'],
        'lib': [],
        'viv': ['HIP', 'CES'],
        'rem': [],
        'nga': [],
        'fic': ['VF'],
        'cdt': ['VF', 'REN', 'VEN', 'REI'],
        'prd': ['PO', 'POCDC', 'PART', 'PA']
    };

    function actualizarOpcionesTipoBase() {
        const productoSelect = document.getElementById('producto');
        const tipoBaseSelect = document.getElementById('tipo_base');
        const producto = productoSelect.value;

        tipoBaseSelect.innerHTML = '<option value="">--Sin tipo--</option>';

        if (tiposBaseMap[producto]) {
            tiposBaseMap[producto].forEach(tipo => {
                const option = document.createElement('option');
                option.value = tipo.toLowerCase();
                option.textContent = tipo;
                tipoBaseSelect.appendChild(option);
            });
        }

        const option = document.createElement('option');
        option.value = 'CUSTOM';
        option.textContent = '➕ Custom';
        tipoBaseSelect.appendChild(option);
    }

    function cambiarTab(event, tabId) {
        event.preventDefault();
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
        if (tabId === 'tab-config') cargarHistorialVisual();
    }

    function obtenerValorCampo(id) {
        const select = document.getElementById(id);
        if (!select) return '';
        if (select.value === 'CUSTOM') {
            const customVal = document.getElementById(id + '_custom').value.trim().toLowerCase();
            return customVal || '';
        }
        return select.value.toLowerCase();
    }

    function gestionarOpCultura(fieldId) {
        const select = document.getElementById(fieldId);
        const customInput = document.getElementById(fieldId + '_custom');
        if (select && customInput) {
            if (select.value === 'CUSTOM') {
                customInput.style.display = 'block';
                customInput.focus();
            } else {
                customInput.style.display = 'none';
            }
        }
    }

    function generarLote() {
        let journeyNum = document.getElementById('journey_num').value.trim().toLowerCase() || 'j1';
        const linea = obtenerValorCampo('linea_presupuestal');
        const campana = obtenerValorCampo('campana');
        const producto = obtenerValorCampo('producto');
        const tipoBase = obtenerValorCampo('tipo_base');
        const segmento = obtenerValorCampo('segmento');
        const oferta = obtenerValorCampo('oferta');
        const canal = obtenerValorCampo('canal');
        const fecha = document.getElementById('fecha').value.trim().toLowerCase() || '092026';
        const urlBase = document.getElementById('url_base').value.trim();

        const mediosConfig = [
            { nombre: 'email', cant: parseInt(document.getElementById('cant_email').value) || 0 },
            { nombre: 'whatsapp', cant: parseInt(document.getElementById('cant_whatsapp').value) || 0 },
            { nombre: 'sms', cant: parseInt(document.getElementById('cant_sms').value) || 0 }
        ];

        loteActualCalculado = [];
        const tbody = document.getElementById('filas-lote');
        tbody.innerHTML = '';

        mediosConfig.forEach(item => {
            if (item.cant > 0) {
                for (let i = 1; i <= item.cant; i++) {
                    const basePart = tipoBase ? `_${tipoBase}` : '';
                    const journeyName = `${journeyNum}_${linea}_${campana}_${producto}${basePart}_${segmento}_${oferta}_${canal}_${fecha}`.toLowerCase();
                    const messageName = `${linea}_${campana}_${producto}_${segmento}_${oferta}_${item.nombre}_${i}`.toLowerCase();
                    const utmCampaign = `${linea}_${campana}_${producto}${basePart}_${segmento}_${oferta}_${canal}`.toLowerCase();
                    const utmContent = `${linea}_${campana}_${producto}_${segmento}_${oferta}_${item.nombre}`.toLowerCase();

                    let urlFinal = "---";
                    if (urlBase) {
                        const conector = urlBase.includes('?') ? '&' : '?';
                        urlFinal = `${urlBase}${conector}utm_source=sfmc&utm_medium=${item.nombre}&utm_campaign=${utmCampaign}&utm_content=${utmContent}`;
                    }

                    loteActualCalculado.push({
                        medio: item.nombre,
                        impacto: i,
                        journeyName,
                        messageName,
                        utmCampaign,
                        utmContent,
                        urlFinal
                    });

                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td><strong>${item.nombre}</strong></td><td>Impacto ${i}</td><td><code>${journeyName}</code></td><td><code>${messageName}</code></td><td><code>${utmCampaign}</code></td><td><code>${utmContent}</code></td><td style="word-break:break-all; font-size:10.5px;">${urlFinal}</td>`;
                    tbody.appendChild(tr);
                }
            }
        });

        if (loteActualCalculado.length > 0) {
            document.getElementById('result-box-lote').style.display = 'block';
        } else {
            alert('Por favor indica al menos 1 impacto en alguno de los medios.');
        }
    }

    function copiarTablaMasiva() {
        if (loteActualCalculado.length === 0) return;
        let textoTSV = "Medio\tImpacto\tJourney Name\tMessage Name\tUTM Campaign\tUTM Content\tURL Final\n";
        loteActualCalculado.forEach(item => {
            textoTSV += `${item.medio}\t${item.impacto}\t${item.journeyName}\t${item.messageName}\t${item.utmCampaign}\t${item.utmContent}\t${item.urlFinal}\n`;
        });
        navigator.clipboard.writeText(textoTSV).then(() => {
            alert('✨ Copiado exitosamente. Puedes pegarlo en Excel (Ctrl + V).');
        });
    }

    function guardarLoteEnBitacora() {
        if (loteActualCalculado.length === 0) return;
        const btn = document.getElementById('btn-guardar-lote');
        const statusDiv = document.getElementById('status-mensaje');
        btn.disabled = true;
        btn.innerText = "⏳ Guardando en Google Sheets...";

        const promesas = loteActualCalculado.map(registro => {
            const payload = {
                action: "save",
                medio: registro.medio,
                canal: document.getElementById('canal').value || '',
                journeyName: registro.journeyName,
                messageName: registro.messageName,
                utmCampaign: registro.utmCampaign,
                utmContent: registro.utmContent,
                urlFinal: registro.urlFinal
            };
            return fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) }).then(res => res.json());
        });

        Promise.all(promesas).then(resultados => {
            if (resultados.every(r => r.success)) {
                statusDiv.textContent = `✅ ${loteActualCalculado.length} registros guardados exitosamente en Google Sheets.`;
                statusDiv.className = 'status-alert success';
                btn.disabled = false;
                btn.innerText = "💾 Registrar Lote en Google Sheets";
                setTimeout(() => cargarHistorialVisual(), 1000);
            } else {
                statusDiv.textContent = '❌ Error al guardar algunos registros.';
                statusDiv.className = 'status-alert error';
                btn.disabled = false;
                btn.innerText = "💾 Registrar Lote en Google Sheets";
            }
        }).catch(err => {
            statusDiv.textContent = `❌ Error al guardar: ${err.message}`;
            statusDiv.className = 'status-alert error';
            btn.disabled = false;
            btn.innerText = "💾 Registrar Lote en Google Sheets";
        });
    }

    function cargarHistorialVisual() {
        const tbody = document.getElementById('historial-filas');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Cargando registros...</td></tr>';
        fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "read" }) })
            .then(res => res.json()).then(data => {
                if (data.success && data.data && data.data.length > 0) {
                    tbody.innerHTML = '';
                    data.data.reverse().forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td><strong>${item['Fecha'] || ''}</strong></td><td>${item['Medio'] || ''}</td><td><code style="color:#2b6cb0;">${item['Journey Name'] || ''}</code></td><td><code style="color:#2f855a;">${item['Message Name'] || ''}</code></td><td><code style="color:var(--banco-blue); font-weight:bold;">${item['UTM Campaign'] || ''}</code></td>`;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#a0aec0; padding:15px;">No hay registros en Google Sheets todavía.</td></tr>';
                }
            }).catch(err => {
                console.error("Error:", err);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#e53e3e; padding:15px;">Error al conectar con Google Sheets.</td></tr>';
            });
    }

    document.addEventListener("DOMContentLoaded", () => {
        if (document.getElementById('producto').value) actualizarOpcionesTipoBase();
    });
</script>

</body>
</html>
