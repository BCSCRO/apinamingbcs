<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramienta Naming Ventas Digitales - Banco Caja Social</title>
    <style>
        :root {
            --banco-blue: #003366;
            --banco-hover: #002244;
            --banco-green: #4cbd74;
            --bg-gray: #f4f7fa;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #1a202c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background-color: var(--bg-gray); 
            color: var(--text-color);
            margin: 0;
        }
        .container { 
            max-width: 1100px; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            margin: 10px auto; 
        }
        
        .header-app { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding-bottom: 18px; 
            margin-bottom: 20px; 
            border-bottom: 4px solid var(--banco-blue); 
        }
        .logo-text { 
            font-size: 24px; 
            font-weight: bold; 
            color: var(--banco-blue); 
        }
        .title-app { 
            color: var(--banco-blue); 
            font-size: 18px; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin: 0; 
            text-align: right; 
        }

        .tabs { 
            display: flex; 
            border-bottom: 2px solid var(--border-color); 
            margin-bottom: 20px; 
            gap: 4px;
        }
        .tab-button { 
            padding: 10px 18px; 
            cursor: pointer; 
            background: #e2e8f0; 
            border: none; 
            border-radius: 6px 6px 0 0; 
            font-weight: bold; 
            color: #4a5568; 
            font-size: 13px;
        }
        .tab-button.active { 
            background: var(--banco-blue); 
            color: white; 
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); 
            gap: 14px; 
        }
        .full-width { grid-column: 1 / -1; }
        label { 
            font-weight: 700; 
            display: block; 
            margin-top: 4px; 
            color: #4a5568; 
            font-size: 12px; 
            text-transform: uppercase;
        }
        select, input { 
            width: 100%; 
            padding: 8px 10px; 
            margin-top: 4px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 13px; 
            background-color: #fff;
        }
        select:focus, input:focus { 
            border-color: var(--banco-blue); 
            outline: none; 
            background-color: #f8fafc; 
        }
        .custom-input {
            margin-top: 4px;
            border-color: var(--banco-green);
            background-color: #f0fdf4;
            display: none;
        }

        .batch-box {
            background: #f0fdf4;
            border: 1px solid var(--banco-green);
            border-radius: 8px;
            padding: 16px;
            margin-top: 15px;
        }
        .batch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .batch-item {
            background: white;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .batch-item label {
            margin: 0;
            text-transform: capitalize;
            font-size: 12px;
        }
        .batch-item input[type="number"] {
            width: 55px;
            padding: 4px;
            margin: 0;
            text-align: center;
        }

        button.primary-btn { 
            width: 100%; 
            background-color: var(--banco-blue); 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            margin-top: 15px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
        }
        button.primary-btn:hover { background-color: var(--banco-hover); }
        button.primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .result-box { 
            margin-top: 20px; 
            padding: 18px; 
            background: #f8fafc; 
            border: 1px solid var(--border-color);
            border-left: 6px solid var(--banco-blue); 
            border-radius: 8px; 
            display: none;
        }

        .batch-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            margin-top: 12px;
            background: white;
        }
        .batch-table th, .batch-table td {
            padding: 8px;
            border: 1px solid #cbd5e1;
            text-align: left;
        }
        .batch-table th {
            background: var(--banco-blue);
            color: white;
        }

        .copy-btn { 
            background-color: #edf2f7; 
            color: #4a5568; 
            padding: 6px 12px; 
            font-size: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 600; 
        }
        .copy-btn:hover { background-color: #e2e8f0; }

        .history-table-container { margin-top: 15px; overflow-x: auto; }
        table.history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            text-align: left;
        }
        table.history-table th, table.history-table td {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        table.history-table th {
            background-color: var(--banco-blue);
            color: white;
        }

        .status-alert {
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
            font-weight: 500;
        }
        .status-alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status-alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-app">
        <span class="logo-text">🏦 Banco Caja Social</span>
        <h1 class="title-app">Generador Naming & UTMs Salida en Minúsculas (Hoja 4)</h1>
    </div>

    <div class="tabs">
        <button class="tab-button active" onclick="cambiarPestaña('tab-generador', this)">1. Generador de Naming</button>
        <button class="tab-button" onclick="cambiarPestaña('tab-config', this)">2. Bitácora / Registros</button>
    </div>

    <!-- TAB 1: GENERADOR -->
    <div id="tab-generador" class="tab-content active">
        <div class="grid">
            <div>
                <label for="journey_num">Journey (j1, j2...)</label>
                <input type="text" id="journey_num" placeholder="ej: j1, j2, j3" value="j1">
            </div>
            
            <div>
                <label for="linea_presupuestal">Línea Presupuestal *</label>
                <select id="linea_presupuestal" onchange="gestionarOpCultura(this.id)">
                    <option value="">-- Seleccionar --</option>
                    <option value="con">Conservación (con)</option>
                    <option value="rea">Reactivación (rea)</option>
                    <option value="pro">Profundización (pro)</option>
                    <option value="fid">Fidelización VF (fid)</option>
                    <option value="onb">Onboarding (onb)</option>
                    <option value="tx">Transaccionalidad (tx)</option>
                    <option value="cmi">CMI (cmi)</option>
                    <option value="otr">Otras campañas (otr)</option>
                    <option value="CUSTOM">➕ Otro / Agregar nuevo...</option>
                </select>
                <input type="text" id="linea_presupuestal_custom" class="custom-input" placeholder="Ingresa el código">
            </div>

            <div>
                <label for="campana">Campaña *</label>
                <select id="campana" onchange="gestionarOpCultura(this.id)">
                    <option value="">-- Seleccionar --</option>
                    <option value="tyg">Transa y gana (tyg)</option>
                    <option value="pam">Premio Amigo (pam)</option>
                    <option value="mcd">Mastercard (mcd)</option>
                    <option value="nbe">Nueva mejor experiencia (nbe)</option>
                    <option value="etn">Equipemos tu negocio (etn)</option>
                    <option value="mpa">Mi pago amigo (mpa)</option>
                    <option value="na">Negocio amigo (na)</option>
                    <option value="col">Colmena (col)</option>
                    <option value="CUSTOM">➕ Otro / Agregar nuevo...</option>
                </select>
                <input type="text" id="campana_custom" class="custom-input" placeholder="Ingresa el código">
            </div>

            <div>
                <label for="producto">Producto *</label>
                <select id="producto" onchange="actualizarOpcionesTipoBase(); gestionarOpCultura(this.id)">
                    <option value="">-- Seleccionar --</option>
                    <option value="cad">Cuentamiga (cad)</option>
                    <option value="tdc">Tarjeta de Crédito (tdc)</option>
                    <option value="crd">Crédito Libre Inversión (crd)</option>
                    <option value="lib">Libranza (lib)</option>
                    <option value="viv">Vivienda (viv)</option>
                    <option value="rem">Remesas (rem)</option>
                    <option value="nga">Negocio Amigo (nga)</option>
                    <option value="fic">Fics (fic)</option>
                    <option value="cdt">CDT (cdt)</option>
                    <option value="prd">Productivo (prd)</option>
                    <option value="CUSTOM">➕ Otro / Agregar nuevo...</option>
                </select>
                <input type="text" id="producto_custom" class="custom-input" placeholder="Ingresa el código">
            </div>

            <div>
                <label for="tipo_base">Tipo Base</label>
                <select id="tipo_base" onchange="gestionarOpCultura(this.id)">
                    <option value="">-- Sin tipo de base --</option>
                </select>
                <input type="text" id="tipo_base_custom" class="custom-input" placeholder="Ingresa el código">
            </div>

            <div>
                <label for="segmento">Segmento *</label>
                <select id="segmento" onchange="gestionarOpCultura(this.id)">
                    <option value="">-- Seleccionar --</option>
                    <option value="per">Personas (per)</option>
                    <option value="mic">Microempresas (mic)</option>
                    <option value="emp">Empresas (emp)</option>
                    <option value="pym">Pymes (pym)</option>
                    <option value="pen">Pensionados (pen)</option>
                    <option value="CUSTOM">➕ Otro / Agregar nuevo...</option>
                </select>
                <input type="text" id="segmento_custom" class="custom-input" placeholder="Ingresa el código">
            </div>

            <div>
                <label for="oferta">Oferta o Mensaje *</label>
                <select id="oferta" onchange="gestionarOpCultura(this.id)">
                    <option value="">-- Seleccionar --</option>
                    <option value="breb">BREB (breb)</option>
                    <option value="usal">Uso alcancia (usal)</option>
                    <option value="us">Uso (us)</option>
                    <option value="gan">Ganadores (gan)</option>
                    <option value="ref">Referidos (ref)</option>
                    <option value="mejviv">Mejoramiento Vivienda (mejviv)</option>
                    <option value="seg">Seguros (seg)</option>
                    <option value="ben">Beneficios (ben)</option>
                    <option value="apal">Apertura Alcancia (apal)</option>
                    <option value="apfics">Apertura FICS (apfics)</option>
                    <option value="CUSTOM">➕ Otro / Agregar nuevo...</option>
                </select>
                <input type="text" id="oferta_custom" class="custom-input" placeholder="Ingresa el código">
            </div>

            <div>
                <label for="canal">Canal *</label>
                <select id="canal" onchange="gestionarOpCultura(this.id)">
                    <option value="">-- Seleccionar --</option>
                    <option value="md">Medios directos (md)</option>
                    <option value="ads">Medios pagos (ads)</option>
                    <option value="mp">Medios propios (mp)</option>
                    <option value="CUSTOM">➕ Otro / Agregar nuevo...</option>
                </select>
                <input type="text" id="canal_custom" class="custom-input" placeholder="Ingresa el código">
            </div>

            <div>
                <label for="fecha">Fecha (MMAAAA)</label>
                <input type="text" id="fecha" placeholder="ej: 092026" value="092026">
            </div>
        </div>

        <div class="batch-box">
            <label style="font-size: 14px; text-transform: none;">📊 Matriz de Impactos Multi-canal - Indica cuántos mensajes generar por medio:</label>
            <div class="batch-grid">
                <div class="batch-item">
                    <label>📩 Email</label>
                    <input type="number" id="cant_email" value="1" min="0" max="10">
                </div>
                <div class="batch-item">
                    <label>💬 WhatsApp</label>
                    <input type="number" id="cant_whatsapp" value="1" min="0" max="10">
                </div>
                <div class="batch-item">
                    <label>📱 SMS</label>
                    <input type="number" id="cant_sms" value="1" min="0" max="10">
                </div>
                <div class="batch-item">
                    <label>🔍 Google Ads</label>
                    <input type="number" id="cant_google" value="1" min="0" max="10">
                </div>
                <div class="batch-item">
                    <label>👥 Meta Ads</label>
                    <input type="number" id="cant_meta" value="1" min="0" max="10">
                </div>
            </div>
        </div>

        <div class="full-width">
            <label for="url_base">URL Destino Base (Landing Page):</label>
            <input type="url" id="url_base" placeholder="https://ejemplo.com/landing">
        </div>

        <button class="primary-btn" onclick="generarLote()">🚀 Generar Todos los Namings & UTMs (Minúsculas)</button>
        <button class="primary-btn" style="background-color: #a0aec0; margin-top: 10px;" onclick="copiarTablaMasiva()">📋 Copiar para Excel</button>

        <div id="result-box-lote" class="result-box">
            <strong>📋 Lista de Marcaciones Generadas</strong>
            <div class="history-table-container">
                <table class="batch-table">
                    <thead>
                        <tr>
                            <th>Medio</th>
                            <th>Impacto</th>
                            <th>Journey Name</th>
                            <th>Message Name</th>
                            <th>UTM Campaign</th>
                            <th>UTM Content</th>
                            <th>URL Final</th>
                        </tr>
                    </thead>
                    <tbody id="filas-lote"></tbody>
                </table>
            </div>
            <button class="primary-btn" id="btn-guardar-lote" onclick="guardarLoteEnBitacora()">💾 Registrar Lote en Google Sheets</button>
            <div id="status-mensaje" class="status-alert"></div>
        </div>
    </div>

    <!-- TAB 2: BITÁCORA -->
    <div id="tab-config" class="tab-content">
        <button class="primary-btn" style="background-color: var(--banco-green); margin-bottom: 15px;" onclick="cargarHistorialVisual()">🔄 Actualizar Tabla</button>
        
        <div class="history-table-container">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Medio / Canal</th>
                        <th>Journey Name</th>
                        <th>Message Name</th>
                        <th>UTM Campaign</th>
                    </tr>
                </thead>
                <tbody id="historial-filas">
                    <tr>
                        <td colspan="5" style="text-align:center; padding:20px; color:#a0aec0;">Cargando registros desde Google Sheets...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // URL de Apps Script - REEMPLAZAR CON TU URL
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNV7zeleJ133uN6PMoHkBDLDNzRMactXOZK7fcTwcxi8cEpw0UOBzhCCu0ijnKku_hXw/exec";

    let loteActualCalculado = [];

    // Tipos de base por producto
    const tiposBasePorProducto = {
        'tdc': [
            { label: 'Visa', value: 'visa' },
            { label: 'Mastercard', value: 'mcd' },
            { label: 'American Express', value: 'amex' }
        ],
        'crd': [
            { label: 'Libre Inversión', value: 'li' },
            { label: 'Complementario', value: 'comp' }
        ],
        'viv': [
            { label: 'Hipotecario', value: 'hip' },
            { label: 'Complementario', value: 'comp' }
        ],
        'lib': [
            { label: 'Libranza Pensionados', value: 'pen' },
            { label: 'Libranza Empleados', value: 'emp' }
        ]
    };

    function actualizarOpcionesTipoBase() {
        const prodSelect = document.getElementById('producto');
        const tipoBaseSelect = document.getElementById('tipo_base');
        const prodValue = prodSelect.value.toLowerCase();

        tipoBaseSelect.innerHTML = '';

        const optBlank = document.createElement('option');
        optBlank.value = '';
        optBlank.textContent = '-- Sin tipo de base / En blanco --';
        tipoBaseSelect.appendChild(optBlank);

        const opciones = tiposBasePorProducto[prodValue] || [];

        opciones.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt.value;
            option.textContent = opt.label;
            tipoBaseSelect.appendChild(option);
        });

        const optCustom = document.createElement('option');
        optCustom.value = 'CUSTOM';
        optCustom.textContent = '➕ Otro / Agregar nuevo...';
        tipoBaseSelect.appendChild(optCustom);

        tipoBaseSelect.selectedIndex = opciones.length > 0 ? 1 : 0;
        gestionarOpCultura('tipo_base');
    }

    function cambiarPestaña(tabId, boton) {
        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(tb => tb.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        boton.classList.add('active');
        if (tabId === 'tab-config') {
            cargarHistorialVisual();
        }
    }

    function obtenerValorCampo(id) {
        const select = document.getElementById(id);
        if (!select) return '';
        if (select.value === 'CUSTOM') {
            const customVal = document.getElementById(id + '_custom').value.trim().toLowerCase();
            return customVal || '';
        }
        return select.value.toLowerCase();
    }

    function gestionarOpCultura(fieldId) {
        const select = document.getElementById(fieldId);
        const customInput = document.getElementById(fieldId + '_custom');
        if (select && customInput) {
            if (select.value === 'CUSTOM') {
                customInput.style.display = 'block';
                customInput.focus();
            } else {
                customInput.style.display = 'none';
            }
        }
    }

    function generarLote() {
        let journeyNum = document.getElementById('journey_num').value.trim().toLowerCase() || 'j1';

        const linea = obtenerValorCampo('linea_presupuestal');
        const campana = obtenerValorCampo('campana');
        const producto = obtenerValorCampo('producto');
        const tipoBase = obtenerValorCampo('tipo_base');
        const segmento = obtenerValorCampo('segmento');
        const oferta = obtenerValorCampo('oferta');
        const canal = obtenerValorCampo('canal');
        const fecha = document.getElementById('fecha').value.trim().toLowerCase() || '092026';
        const urlBase = document.getElementById('url_base').value.trim();

        const mediosConfig = [
            { nombre: 'email', cant: parseInt(document.getElementById('cant_email').value) || 0 },
            { nombre: 'whatsapp', cant: parseInt(document.getElementById('cant_whatsapp').value) || 0 },
            { nombre: 'sms', cant: parseInt(document.getElementById('cant_sms').value) || 0 },
            { nombre: 'google', cant: parseInt(document.getElementById('cant_google').value) || 0 },
            { nombre: 'meta', cant: parseInt(document.getElementById('cant_meta').value) || 0 }
        ];

        loteActualCalculado = [];
        const tbody = document.getElementById('filas-lote');
        tbody.innerHTML = '';

        mediosConfig.forEach(item => {
            if (item.cant > 0) {
                for (let i = 1; i <= item.cant; i++) {
                    let medio = item.nombre;

                    const basePart = tipoBase ? `_${tipoBase}` : '';
                    
                    const journeyName = `${journeyNum}_${linea}_${campana}_${producto}${basePart}_${segmento}_${oferta}_${canal}_${fecha}`.toLowerCase();
                    const messageName = `${linea}_${campana}_${producto}_${segmento}_${oferta}_${medio}`.toLowerCase();
                    const utmCampaign = `${linea}_${campana}_${producto}${basePart}_${segmento}_${oferta}_${canal}`.toLowerCase();
                    const utmContent = `${linea}_${campana}_${producto}_${segmento}_${oferta}_${medio}`.toLowerCase();

                    let urlFinal = "---";
                    if (urlBase) {
                        const conector = urlBase.includes('?') ? '&' : '?';
                        urlFinal = `${urlBase}${conector}utm_source=sfmc&utm_medium=${medio}&utm_campaign=${utmCampaign}&utm_content=${utmContent}`;
                    }

                    const registro = {
                        medio,
                        impacto: i,
                        journeyName,
                        messageName,
                        utmCampaign,
                        utmContent,
                        urlFinal,
                        fecha
                    };

                    loteActualCalculado.push(registro);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${medio}</strong></td>
                        <td>Impacto ${i}</td>
                        <td><code>${journeyName}</code></td>
                        <td><code>${messageName}</code></td>
                        <td><code>${utmCampaign}</code></td>
                        <td><code>${utmContent}</code></td>
                        <td style="word-break:break-all; font-size:10.5px;">${urlFinal}</td>
                    `;
                    tbody.appendChild(tr);
                }
            }
        });

        if (loteActualCalculado.length > 0) {
            document.getElementById('result-box-lote').style.display = 'block';
        } else {
            alert('Por favor indica al menos 1 impacto en alguno de los medios.');
        }
    }

    function copiarTablaMasiva() {
        if (loteActualCalculado.length === 0) return;
        
        let textoTSV = "Medio\tImpacto\tJourney Name\tMessage Name\tUTM Campaign\tUTM Content\tURL Final\n";
        loteActualCalculado.forEach(item => {
            textoTSV += `${item.medio}\t${item.impacto}\t${item.journeyName}\t${item.messageName}\t${item.utmCampaign}\t${item.utmContent}\t${item.urlFinal}\n`;
        });

        navigator.clipboard.writeText(textoTSV).then(() => {
            alert('✨ Copiado exitosamente. Puedes pegarlo en Excel (Ctrl + V).');
        });
    }

    function guardarLoteEnBitacora() {
        if (loteActualCalculado.length === 0) return;

        const btn = document.getElementById('btn-guardar-lote');
        const statusDiv = document.getElementById('status-mensaje');
        btn.disabled = true;
        btn.innerText = "⏳ Guardando en Google Sheets...";

        // Guardar cada registro del lote
        const promesas = loteActualCalculado.map(registro => {
            const payload = {
                action: "save",
                fecha: new Date().toLocaleDateString('es-CO'),
                hora: new Date().toLocaleTimeString('es-CO'),
                medio: registro.medio,
                canal: document.getElementById('canal').value || '',
                journeyName: registro.journeyName,
                messageName: registro.messageName,
                utmCampaign: registro.utmCampaign,
                utmContent: registro.utmContent,
                urlFinal: registro.urlFinal
            };

            return fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            }).then(res => res.json());
        });

        Promise.all(promesas)
            .then(resultados => {
                if (resultados.every(r => r.success)) {
                    statusDiv.textContent = `✅ ${loteActualCalculado.length} registros guardados exitosamente en Google Sheets.`;
                    statusDiv.className = 'status-alert success';
                    btn.disabled = false;
                    btn.innerText = "💾 Registrar Lote en Google Sheets";
                    setTimeout(() => cargarHistorialVisual(), 1000);
                } else {
                    statusDiv.textContent = '❌ Error al guardar algunos registros.';
                    statusDiv.className = 'status-alert error';
                    btn.disabled = false;
                    btn.innerText = "💾 Registrar Lote en Google Sheets";
                }
            })
            .catch(err => {
                statusDiv.textContent = `❌ Error al guardar: ${err.message}`;
                statusDiv.className = 'status-alert error';
                btn.disabled = false;
                btn.innerText = "💾 Registrar Lote en Google Sheets";
            });
    }

    function cargarHistorialVisual() {
        const tbody = document.getElementById('historial-filas');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Cargando registros...</td></tr>';

        const payload = { action: "read" };

        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.data && data.data.length > 0) {
                    tbody.innerHTML = '';
                    // Mostrar en orden inverso (más recientes primero)
                    data.data.reverse().forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong>${item['Fecha'] || ''}</strong></td>
                            <td>${item['Medio'] || ''}</td>
                            <td><code style="color:#2b6cb0;">${item['Journey Name'] || ''}</code></td>
                            <td><code style="color:#2f855a;">${item['Message Name'] || ''}</code></td>
                            <td><code style="color:var(--banco-blue); font-weight:bold;">${item['UTM Campaign'] || ''}</code></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#a0aec0; padding:15px;">No hay registros en Google Sheets todavía.</td></tr>';
                }
            })
            .catch(err => {
                console.error("Error al obtener registros:", err);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#e53e3e; padding:15px;">Error al conectar con Google Sheets.</td></tr>';
            });
    }

    // Cargar historial al cambiar a la pestaña
    document.addEventListener("DOMContentLoaded", () => {
        // Inicializar tipos base si hay producto seleccionado
        if (document.getElementById('producto').value) {
            actualizarOpcionesTipoBase();
        }
    });
</script>

</body>
</html>
